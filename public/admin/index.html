<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Area Admin — Briscol Champions Cup</title>
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">

  <style>
    .login-box {
      max-width: 420px;
      margin: 4rem auto;
      background: linear-gradient(160deg, rgba(10,77,53,.6), rgba(6,46,33,.9));
      border: 1px solid rgba(212,175,55,.35);
      border-radius: var(--raggio);
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: var(--ombra-carta);
    }
    .login-box h1 { font-size: 1.4rem; margin-bottom: .5rem; }
    .login-box p  { font-size: .85rem; opacity: .7; margin-bottom: 1.5rem; }
    .netlify-identity-widget { color-scheme: dark; }

    #vista-messaggio {
      display: none;
      text-align: center;
      padding: 1rem 0;
    }
    #vista-messaggio h2 {
      color: var(--oro);
      font-size: 1.2rem;
      margin-bottom: .6rem;
    }
    #vista-messaggio p {
      font-size: .85rem;
      opacity: .8;
      line-height: 1.6;
    }
    .spin {
      display: inline-block;
      width: 26px; height: 26px;
      border: 3px solid rgba(212,175,55,.3);
      border-top-color: var(--oro);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 1rem auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <div class="container">
      <a href="../index.html" class="logo">Briscol Champions Cup</a>
    </div>
  </header>

  <main class="container">
    <div class="login-box">

      <div id="vista-login">
        <h1>Area Riservata</h1>
        <p>Solo l'organizzazione può entrare qui. I risultati inseriti si aggiornano sul sito in tempo reale.</p>
        <button class="btn btn-oro" id="btn-login">Accedi come Admin</button>
      </div>

      <div id="vista-messaggio">
        <div class="spin"></div>
        <h2 id="msg-titolo">Attivazione account…</h2>
        <p id="msg-testo">Completa la procedura nella finestra di Netlify.</p>
      </div>

    </div>
  </main>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    // ============================================================
    // 1. Inizializza il widget (gestisce da solo i token #invite_token)
    // ============================================================
    netlifyIdentity.init();

    const vistaLogin = document.getElementById('vista-login');
    const vistaMsg   = document.getElementById('vista-messaggio');

    // ============================================================
    // 2. Se c'è un invite_token → apri il widget in modalità signup
    //    Il widget Netlify gestisce nativamente questo flusso
    // ============================================================
    const hash = window.location.hash;
    const paramsHash = new URLSearchParams(hash.replace(/^#/, ''));
    const inviteToken = paramsHash.get('invite_token') || paramsHash.get('confirmation_token');

    if (inviteToken) {
      vistaLogin.style.display = 'none';
      vistaMsg.style.display   = 'block';
      document.getElementById('msg-titolo').textContent = 'Benvenuto! 🃏';
      document.getElementById('msg-testo').textContent  =
        'Nella finestra che si apre imposta la password. Se non la vedi, clicca di nuovo il bottone sotto.';

      // Piccolo delay per essere sicuri che il widget abbia letto il token
      setTimeout(() => {
        // Se Netlify ha già processato il token, siamo già "logged in"
        const user = netlifyIdentity.currentUser();
        if (user) {
          window.location.href = 'dashboard.html';
          return;
        }
        // Altrimenti apriamo il widget che mostrerà il form di signup
        netlifyIdentity.open('signup');
      }, 400);
    }

    // ============================================================
    // 3. Login normale (nessun token nell'URL)
    // ============================================================
    netlifyIdentity.on('init', user => {
      if (user && !inviteToken) window.location.href = 'dashboard.html';
    });

    netlifyIdentity.on('login', () => {
      window.location.href = 'dashboard.html';
    });

    document.getElementById('btn-login').addEventListener('click', () => {
      netlifyIdentity.open('login');
    });
  </script>
</body>
</html>
